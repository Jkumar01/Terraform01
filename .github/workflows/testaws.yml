name: Test AWS OIDC Connection
on:
    push:
        branches:
            - main
            - dev
    workflow_dispatch:

permissions:
    id-token: write
    contents: read

jobs:
    Test-Job:
        name: Test AWS OIDC Connection
        runs-on: ubuntu-latest
        env:
            ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: ${{ vars.ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION }}
        steps:
            - name: Debug OIDC Token Claims
              run: |
                IDTOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                  "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
                echo "--- Decoded JWT Claims ---"
                echo $IDTOKEN | cut -d. -f2 | base64 -d 2>/dev/null | jq .

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: arn:aws:iam::332665093871:role/GitHubActionsRole
                  aws-region: ap-south-1
                  audience: sts.amazonaws.com

            - name: Verify AWS Identity
              run: aws sts get-caller-identity