name: Terraform Deploy
on:
    push:
        branches:
            - main
            - dev
    workflow_dispatch:

permissions:
    id-token: write
    contents: read

jobs:
    Backend:
        name: Terraform Backend
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./Terrafrom/backend
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: arn:aws:iam::332665093871:role/GitHubActionsRole
                  aws-region: ap-south-1
                  audience: sts.amazonaws.com

            - name: Verify AWS Identity
              run: aws sts get-caller-identity

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3

            - name: Terraform Init
              run: terraform init

            - name: Terraform Import S3 Bucket
              run: terraform import aws_s3_bucket.terraform_state cde-terraform-state-dev || true

            - name: Terraform Import S3 Versioning
              run: terraform import aws_s3_bucket_versioning.versioning cde-terraform-state-dev || true

            - name: Terraform Import S3 Encryption
              run: terraform import aws_s3_bucket_server_side_encryption_configuration.encryption cde-terraform-state-dev || true

            - name: Terraform Import DynamoDB Table
              run: terraform import aws_dynamodb_table.terraform_locks terraform-locks || true

            - name: Terraform Plan
              run: terraform plan

            - name: Terraform Apply
              run: terraform apply -auto-approve

    Network:
        name: Terraform Network (VPC, Subnets, IGW, Route Tables)
        runs-on: ubuntu-latest
        needs: Backend
        defaults:
            run:
                working-directory: ./Terrafrom/environments/dev
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: arn:aws:iam::332665093871:role/GitHubActionsRole
                  aws-region: ap-south-1
                  audience: sts.amazonaws.com

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3

            - name: Terraform Init
              run: terraform init -reconfigure

            - name: Terraform Validate
              run: terraform validate

            - name: Terraform Plan
              run: terraform plan -out=tfplan

            - name: Terraform Apply
              run: terraform apply -auto-approve tfplan
